name: Build slate

# Upload the two workbooks to data/imports/<slate>/ (fps.xlsx and moba.xlsx) and this builds, tests and publishes the site.
# Re-uploading a slate's workbooks with the Log's Actual column filled in settles that slate (the frozen projections are never rewritten).
# Commits made with GITHUB_TOKEN do not trigger other workflows, so this job deploys itself.
on:
  push:
    branches: [main]
    paths: ["data/imports/**/*.xlsx", "data/raw/pickfinder/**"]
  workflow_dispatch:
    inputs:
      slate:
        description: "Slate folder under data/imports to (re)build. Blank = the newest."
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  slate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r pipeline/requirements.txt

      - name: Find the slates to build
        id: find
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.slate }}" ]; then
            dirs="${{ github.event.inputs.slate }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dirs="$(ls -1 data/imports | sort | tail -1)"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then before="HEAD~1"; fi
            dirs="$(git diff --name-only "$before" "${{ github.sha }}" -- 'data/imports/**/*.xlsx' | cut -d/ -f3 | sort -u)"
          fi
          # oldest first, so the newest slate is the one left live
          dirs="$(echo "$dirs" | tr ' ' '\n' | sort -u | grep -v '^$' || true)"
          echo "slates<<EOF" >> "$GITHUB_OUTPUT"; echo "$dirs" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Slates: $dirs"

      - name: Validate PickFinder captures
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dirs="${{ github.event.inputs.slate }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then before="HEAD~1"; fi
            dirs="$(git diff --name-only "$before" "${{ github.sha }}" -- 'data/raw/pickfinder/**' | cut -d/ -f4 | sort -u)"
          fi
          for s in $dirs; do
            [ -f "data/raw/pickfinder/$s/capture.json" ] || continue
            echo "### PickFinder capture $s" >> "$GITHUB_STEP_SUMMARY"
            python -m pipeline.pickfinder --slate "$s" --crosscheck | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Import the workbooks
        id: imp
        run: |
          set -euo pipefail
          built=""
          for s in ${{ steps.find.outputs.slates }}; do
            d="data/imports/$s"
            if [ -f "$d/fps.xlsx" ] && [ -f "$d/moba.xlsx" ]; then
              python -m pipeline.import_xlsx --fps "$d/fps.xlsx" --moba "$d/moba.xlsx" | tee -a "$GITHUB_STEP_SUMMARY"
              built="$built $s"
            else
              echo "::notice::$s needs both fps.xlsx and moba.xlsx in $d; skipped until the other arrives"
            fi
          done
          echo "built=$(echo $built)" >> "$GITHUB_OUTPUT"

      - name: Tests (the import guarantees, then the browser model against the workbooks' own numbers)
        if: steps.imp.outputs.built != ''
        run: |
          python -m unittest pipeline.test_import pipeline.test_results pipeline.test_pickfinder
          node site/test/parity.mjs

      - name: Commit the built data
        if: steps.imp.outputs.built != ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/test/expected.json
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Slate ${{ steps.imp.outputs.built }}"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push the slate commit after 3 attempts"; exit 1

      - uses: actions/upload-pages-artifact@v3
        if: steps.imp.outputs.built != ''
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        if: steps.imp.outputs.built != ''
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
